# Render Blueprint for the OCTG Supply Readiness demo.
#
# One web service, one container: the Dockerfile builds the Vite frontend and
# serves it from the FastAPI process (see octg-platform/Dockerfile.deploy for
# what runs at startup and why the database resets on redeploy).
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo and branch.
# AUTH_SECRET is generated by Render on first deploy (never committed here);
# rotating it just logs everyone out -- sessions are self-expiring tokens.
services:
  - type: web
    name: octg-supply-readiness
    runtime: docker
    # free spins down after ~15 min idle (first request then takes ~1 min to
    # cold-start); switch to "starter" for an always-on demo.
    plan: free
    dockerfilePath: ./octg-platform/Dockerfile.deploy
    dockerContext: ./octg-platform
    healthCheckPath: /health
    envVars:
      - key: AUTH_SECRET
        generateValue: true
