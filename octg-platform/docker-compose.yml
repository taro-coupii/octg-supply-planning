services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: octg
      POSTGRES_PASSWORD: octg
      POSTGRES_DB: octg
    ports:
      - "5432:5432"
    volumes:
      - octg_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://octg:octg@db:5432/octg
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host

volumes:
  octg_db_data:
